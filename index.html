<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:dark}html,body{margin:0;background:#0d0e10}[hidden]{display:none!important}</style>
</head>
<body>
<title>Black Sport 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: lienzo 3D a pantalla completa; HUD fijo en las esquinas; hojas que suben desde abajo en celular y aparecen a la derecha en escritorio. Una sola estética oscura, como el gimnasio. */
:root{
  --ink:#0c0d0f;
  --panel:rgba(17,18,21,.84);
  --panel-2:#16171b;
  --line:rgba(255,255,255,.14);
  --text:#f1f0ec;
  --muted:#a4a7ad;
  --accent:#f2c443;
  --accent-ink:#1d1704;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 12px);
  --gb:calc(env(safe-area-inset-bottom,0px) + 16px);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0;touch-action:none;background:var(--ink)}
#stage canvas{display:block;width:100%;height:100%;outline:none}

#top{position:fixed;z-index:5;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{flex:0 1 auto;overflow:hidden;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:7px 12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.b-name{font:italic 800 20px/1 var(--display);letter-spacing:.02em}
.b-sub{font-size:12px;line-height:1.2;color:var(--muted);white-space:nowrap}
.b-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.short{display:none}
@media (max-width:480px){.b-sub{display:none}.b-name{font-size:18px}.brand{padding:10px 11px}.chip{font-size:13px;padding:0 10px;letter-spacing:.05em}.actions{gap:5px;flex-wrap:nowrap}.seg{padding:0 13px}.long{display:none}.short{display:inline}#map{top:calc(var(--gt) + 52px)}}
.actions{flex:0 0 auto;display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.chip{font:700 14px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--text);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer}
.chip:hover{border-color:rgba(255,255,255,.34)}
.chip[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}

#map{position:fixed;z-index:4;left:var(--gl);right:var(--gr);top:calc(var(--gt) + 60px);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:6px}
.map-cap{display:flex;gap:10px;align-items:baseline;padding:1px 4px 6px;font-size:12px;color:var(--muted)}
.cap-k{font:700 13px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--text)}
.cap-m{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.cap-h{margin-left:auto}
.map-img{position:relative;aspect-ratio:1480/380;max-width:100%;border-radius:7px;overflow:hidden;cursor:crosshair;touch-action:none;background:#fff}
.map-img img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
#me{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;transform-origin:50% 50%}
@media (min-width:760px){#map{top:auto;left:auto;bottom:var(--gb);width:430px}}

#mode{position:fixed;z-index:5;right:var(--gr);bottom:var(--gb);display:flex;gap:2px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg{font:700 14px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:0 15px;min-height:40px;cursor:pointer}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pdot{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid #1d1704;box-sizing:border-box;pointer-events:none;display:none}
.pdot.cur{display:none!important}
.pano .pdot{display:block}
#ptip{position:fixed;z-index:4;left:0;top:0;pointer-events:none;font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px;white-space:nowrap}
@media (max-width:480px){#mode .seg{padding:0 10px;letter-spacing:.04em}}
@media (max-width:400px){#mode .seg{padding:0 7px;font-size:13px;letter-spacing:.02em}#mode{gap:0}.touch #joy{width:112px;height:112px}}
@media (min-width:760px){#mode{right:auto;left:50%;transform:translateX(-50%)}}

#joy{position:fixed;z-index:5;left:var(--gl);bottom:var(--gb);width:124px;height:124px;border-radius:50%;background:rgba(17,18,21,.42);border:1px solid var(--line);touch-action:none;display:none}
.touch #joy{display:block}
.air #joy,.photo #joy,.pano #joy{display:none}
.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(241,240,236,.88);box-shadow:0 2px 12px rgba(0,0,0,.45)}

#help{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 140px);width:max-content;max-width:calc(100% - 32px);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.35;text-align:center;transition:opacity .45s}
#help.gone{opacity:0;pointer-events:none}
@media (min-width:760px){#help{bottom:calc(var(--gb) + 64px)}}
#toast{position:fixed;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

#labels{position:fixed;inset:0;z-index:3;pointer-events:none}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 11px;white-space:nowrap;cursor:pointer}
.lbl:hover{border-color:var(--accent);color:var(--accent)}
.lbl[hidden]{display:none}

#sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:74%;overflow:auto;overscroll-behavior:contain;background:var(--panel-2);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px var(--gr) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gl);box-shadow:0 -12px 40px rgba(0,0,0,.5)}
@media (min-width:760px){#sheet{left:auto;right:var(--gr);top:calc(var(--gt) + 58px);bottom:auto;width:390px;max-height:calc(100% - 150px);border:1px solid var(--line);border-radius:14px;padding:16px 18px}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.sh-head h2{font:italic 800 26px/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.zone{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.zone b{font:700 18px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.zone span{grid-column:1;color:var(--muted);font-size:14px;line-height:1.35}
.zone i{grid-row:1/3;grid-column:2;align-self:center;font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;font-style:normal;color:var(--accent)}
.zone:hover b{color:var(--accent)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.opt input{grid-row:1/3;width:22px;height:22px;accent-color:var(--accent);margin:1px 0 0}
.opt b{font:700 17px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
.opt span{color:var(--muted);font-size:14px;line-height:1.35}
.info h3{font:700 13px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.info p,.info li{font-size:15px;line-height:1.5;max-width:62ch;margin:0 0 6px}
.info ul{padding-left:18px;margin:0}
.info a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
.info .credits,.info .credits li{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
.kv dt{font-family:var(--mono);font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv dd{margin:0;color:var(--muted)}
.tag{display:inline-block;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.t-ok{background:rgba(121,196,120,.18);color:#9fd99e}
.t-sup{background:rgba(242,196,67,.16);color:var(--accent)}
.t-ilu{background:rgba(255,255,255,.1);color:var(--muted)}

#photo{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#photo img{position:absolute;top:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%);opacity:.55}
#photo-ui{position:fixed;z-index:6;left:var(--gl);right:var(--gr);bottom:var(--gb);margin:0 auto;max-width:440px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph-row b{font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.ph-row small{color:var(--muted);font-size:13px;line-height:1.3}
.ph-slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph-slider input{width:100%;accent-color:var(--accent)}
.photo #map,.photo #mode{display:none}

#fade{position:fixed;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
#fade.on{opacity:1}
#loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;align-content:center;gap:10px;background:var(--ink);transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
.ld-name{font:italic 800 40px/1 var(--display);letter-spacing:.02em}
.ld-text{color:var(--muted);font-size:14px;text-align:center;padding:0 24px}
@media (prefers-reduced-motion:reduce){#fade,#help,#loading,#toast{transition:none}}
</style>

<div id="stage"></div>

<div id="loading" role="status"><div class="ld-name">BLACK SPORT</div><div class="ld-text" id="ld-text">Armando el recorrido desde el plano…</div></div>

<header id="top">
  <div class="brand"><span class="b-name">BLACK SPORT</span><span class="b-sub">Recorrido 3D · prototipo v0</span></div>
  <nav class="actions" aria-label="Opciones">
    <button id="btn-zonas" class="chip" aria-expanded="false" aria-controls="sheet">Zonas</button>
    <button id="btn-ajustes" class="chip" aria-expanded="false" aria-controls="sheet">Ajustes</button>
    <button id="btn-info" class="chip" aria-expanded="false" aria-controls="sheet">Info</button>
  </nav>
</header>

<section id="map" aria-label="Plano de ubicación">
  <div class="map-cap"><span class="cap-k">Plano</span><span class="cap-m">52 × 13 m</span><span class="cap-h" id="cap-h">Tocá para ir</span></div>

/* ============================================================

const buckets = new Map();

}
function put(g, mk, grp = GRP) {

}

function Sph(cx, cy, cz, r, mk, seg = 16) { return put(new THREE.SphereGeometry(r, seg, Math.max(6, (seg * 0.62) | 0)).translate(cx, cy, cz), mk); }
const _Y = new THREE.Vector3(0, 1, 0);

function at(x, z, rot, fn, o) {   // o: { y: altura, tilt: giro sobre X local, s: escala }
  const prev = XF; XF = new THREE.Matrix4().makeRotationY(rot);

/* ---------- muros con puertas ---------- */
function buildWall(w) {
  const [ax, az] = w.a, [bx, bz] = w.b, alongX = Math.abs(bz - az) < 1e-6, L = alongX ? bx - ax : bz - az, t = w.t, h = w.h;
  const doors = (w.doors || []).slice().sort((p, q) => p[0] - q[0]);
  const box = (s0, s1, y0, y1, col) => { if (s1 - s0 < 0.005) return; let x0, x1, z0, z1;
    if (alongX) { x0 = ax + s0; x1 = ax + s1; z0 = az - t / 2; z1 = az + t / 2; } else { z0 = az + s0; z1 = az + s1; x0 = ax - t / 2; x1 = ax + t / 2; }
    B(x0, y0, z0, x1, y1, z1, w.m); if (col) Col(x0, z0, x1, z1); };
  let s = -t / 2 + 0.004; for (const d of doors) { box(s, d[0], 0, h, true); s = d[1]; } box(s, L + t / 2 - 0.004, 0, h, true);
  for (const d of doors) { const dh = H.door; if (h > dh + 0.01) box(d[0], d[1], dh, h, false);
    const W = d[1] - d[0] - 0.02, sw = d[2] || 1;
    if (alongX) { const hx = ax + d[0] + 0.01, za = az + sw * (t / 2), zb = az + sw * (t / 2 + W); B(hx, 0.01, Math.min(za, zb), hx + 0.04, dh - 0.02, Math.max(za, zb), 'door'); Col(hx, Math.min(za, zb), hx + 0.04, Math.max(za, zb)); }
    else { const hz = az + d[0] + 0.01, xa = ax + sw * (t / 2), xb = ax + sw * (t / 2 + W); B(Math.min(xa, xb), 0.01, hz, Math.max(xa, xb), dh - 0.02, hz + 0.04, 'door'); Col(Math.min(xa, xb), hz, Math.max(xa, xb), hz + 0.04); } }
}

/* ---------- frente vidriado ---------- */
function buildFacade() {
  const X = 31, z0 = HALL.z0, z1 = HALL.z1, gh = H.glass, doors = [[8.06, 9.06], [9.31, 11.16]], solids = [[z0 + 0.1, 8.06], [9.06, 9.31], [11.16, z1 - 0.1]];

  for (const [a, b] of doors) B(X - 0.006, 2.23, a, X + 0.006, gh - 0.05, b, 'glass');
  const mz = [z0 + 0.1]; for (let z = z0 + 1.4; z < 8.06 - 0.4; z += 1.3) mz.push(z); mz.push(8.06, 9.06, 9.31, 11.16, 12.05, z1 - 0.1);
  for (const z of mz) B(X - 0.05, 0, z - 0.03, X + 0.05, gh, z + 0.03, 'alu');

    B(X + 0.06, 0.02, za + 0.015, X + 0.06 + W, 2.14, zb - 0.015, 'glass');

/* ---------- techo abovedado, cabriadas, plafones ---------- */
function buildRoof() {
  GRP = 'ceil';
  const phi = Math.asin(VA / VR), L = 31.4;
  const vault = (r, x0, len, a0, a1, mk, segs = 56) => { const g = new THREE.CylinderGeometry(r, r, len, segs, 1, true, a0, a1 - a0); g.rotateZ(-Math.PI / 2); g.rotateX(-Math.PI / 2); g.translate(x0 + len / 2, VYC, VZC);

  for (let i = 0; i < 10; i++) { const x = 2 + R() * 27, a = (R() - 0.5) * phi * 1.5, da = 1.6 / VR; vault(VR - 0.03, x, 0.85, a, a + da, 'skylight', 6); }

  for (const x of xs) { const top = [], bot = [];
    for (let i = 0; i <= N; i++) { const a = -tT + (2 * tT * i) / N, b = -tB + (2 * tB * i) / N; top.push([x, VYC + rT * Math.cos(a), VZC + rT * Math.sin(a)]); bot.push([x, VYC + rB * Math.cos(b), VZC + rB * Math.sin(b)]); }
    for (let i = 0; i < N; i++) { Rod(top[i], top[i + 1], 0.07, 'truss'); Rod(bot[i], bot[i + 1], 0.06, 'truss'); Rod(i % 2 ? top[i] : bot[i], i % 2 ? bot[i + 1] : top[i + 1], 0.03, 'truss'); }
    Rod(top[0], bot[0], 0.05, 'truss'); Rod(top[N], bot[N], 0.05, 'truss');
    B(x - 0.14, H.eave - 0.4, HALL.z0 + 0.1, x + 0.14, H.eave + 0.05, HALL.z0 + 0.22, 'truss'); B(x - 0.14, H.eave - 0.4, HALL.z1 - 0.22, x + 0.14, H.eave + 0.05, HALL.z1 - 0.1, 'truss'); }

  // vigas reticuladas longitudinales
